[package]
name = "oflama"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A TUI to manage llama.cpp, models, and hardware optimizations"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
tokio = { version = "1.37", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
sysinfo = "0.30"
nvml-wrapper = "0.10"
anyhow = "1.0"
futures = "0.3"
dirs = "5.0"
clap = { version = "4.6.1", features = ["derive"] }
tui-input = "0.15.3"
